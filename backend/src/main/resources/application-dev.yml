spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/ksana_db
    username: ksana_user
    password: ksana_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true

server:
  port: 8081
  servlet:
    context-path: /ksana

