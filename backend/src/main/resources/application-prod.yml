spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://prod-db:5432/ksana
    username: ksana_prod_user
    password: ${KSANA_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

flyway:
  enabled: true
  locations: classpath:db/migration
