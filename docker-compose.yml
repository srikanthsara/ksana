version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: ksana-postgres
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ksana_db
      POSTGRES_USER: ksana_user
      POSTGRES_PASSWORD: ksana_pass
    volumes:
      - ksana_pg_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ksana-backend
    restart: always
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ksana_db
      SPRING_DATASOURCE_USERNAME: ksana_user
      SPRING_DATASOURCE_PASSWORD: ksana_pass
    depends_on:
      - postgres

volumes:
  ksana_pg_data:
